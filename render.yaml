# Render Blueprint for a public SARA demo (https://render.com/docs/blueprint-spec).
# Render prompts for the `sync: false` secrets when the Blueprint is first created.
# APP_PUBLIC_URL is not needed: the app falls back to Render's RENDER_EXTERNAL_URL.
services:
  - type: web
    name: sara-gateway
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "10000"
      - key: APP_ENV
        value: production
      # The demo landing page is the owner console. Set gateway when deploying in front
      # of a real site (then "/" proxies the target and the console stays at /console).
      - key: SARA_MODE
        value: demo
      - key: ADMIN_API_TOKEN
        generateValue: true
      # Owner sign-in: "/" is the home page and the console needs a signed-in owner, using
      # OWNER_EMAIL and OWNER_PASSWORD (entered when the Blueprint is created). Share these
      # with judges privately, for example in the Devpost testing instructions.
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Start with no website: the owner adds theirs on first sign-in.
      - key: SEED_DEFAULT_SITE
        value: "false"
      # Signed-in visitors see the console, so it no longer needs to be public.
      - key: DASHBOARD_PUBLIC
        value: "false"
      # Agent studio at /agent: visitors may start crawler runs and ask the read-only
      # PayPal assistant, capped per hour (DEMO_MAX_RUNS_PER_HOUR,
      # DEMO_MAX_QUESTIONS_PER_HOUR). The playground also needs this for public runs.
      - key: DEMO_PUBLIC
        value: "true"
      # Demo visitors may change tier deposits, rules, and limits live. Changing the
      # target URL without the admin token also requires its host in
      # DEMO_ORIGIN_ALLOWLIST, so the demo host cannot be turned into an open proxy.
      # Remove this for a production gateway.
      # On the free plan storage is ephemeral, so the JSON config resets on redeploy.
      # For a persistent demo, use a paid instance plan, add a disk mounted at
      # /app/storage, and set GATEWAY_CONFIG_PATH=/app/storage/gateway_config.json.
      - key: DEMO_CONFIG_PUBLIC
        value: "false"
      # Public visitors can only point the target URL at these hosts (comma-separated).
      # Empty means the target URL needs the admin token. Add your own site's host to let
      # demo visitors try it against a real website.
      - key: DEMO_ORIGIN_ALLOWLIST
        value: ""
      - key: PLAYGROUND_MAX_RUNS_PER_HOUR
        value: "20"
      # Public AI runs and questions spend the AI key; keep the caps low.
      - key: DEMO_MAX_RUNS_PER_HOUR
        value: "10"
      - key: DEMO_MAX_QUESTIONS_PER_HOUR
        value: "20"
      # Real PayPal Sandbox payments. Without the PayPal secrets, set PAYMENT_MODE=mock.
      - key: PAYMENT_MODE
        value: paypal_sandbox
      # Pay deposits with PayPal's Sandbox test card, so visitors need no Sandbox login.
      - key: PAYPAL_SANDBOX_AUTOPAY
        value: "true"
      - key: DEPOSIT_SETTLEMENT
        # Holds are voided for honest agents, so they cost no PayPal fee.
        value: authorization
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # Optional: the PayPal business account shown as the payout account until the first
      # order or a Log in with PayPal connection names it.
      - key: PAYPAL_MERCHANT_EMAIL
        sync: false
      # PayPal assistant: PayPal's MCP server runs inside the image (@paypal/mcp, stdio).
      - key: PAYPAL_MCP_TRANSPORT
        value: local
      - key: AI_ENABLED
        value: "true"
      # openai uses OPENAI_API_KEY (default model gpt-5.5); set anthropic or auto to use Claude.
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
