<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Explainer engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
#root{position:absolute;inset:0;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.scene{position:absolute;inset:0;display:none;overflow:hidden}
.scene.on{display:block}

/* themes */
.paper{--bg:#F3EEE4;--ink:#141414;--muted:#6E6A62;--accent:#E0352B;--card:#FFFDF8;--line:#141414;color:var(--ink);background:var(--bg);
  background-image:radial-gradient(circle,rgba(20,20,20,.13) 1.6px,transparent 1.7px);background-size:34px 34px}
.midnight{--bg:#060A1A;--ink:#F2F5FF;--muted:#94A0C4;--accent:#5B8CFF;--accent2:#B06BFF;--good:#3DDC84;--bad:#FF5D5D;--warn:#FFC24B;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.14);color:var(--ink);background:#060A1A}
.glow{position:absolute;border-radius:50%;filter:blur(110px);opacity:.5;pointer-events:none}
.g1{width:900px;height:900px;left:-250px;top:-200px;background:#2F5BFF}.g2{width:800px;height:800px;right:-260px;bottom:-300px;background:#9A3CFF;opacity:.35}

/* HUD */
.hud{position:absolute;left:84px;right:84px;top:42px;display:flex;justify-content:space-between;align-items:center;font:600 22px 'JetBrains Mono',monospace;letter-spacing:.04em;color:var(--muted)}
.hud .ctr{display:flex;gap:14px;align-items:center}
.hud .ctr b{display:inline-grid;place-items:center;min-width:46px;height:46px;padding:0 10px;border-radius:12px;font-size:26px;color:#fff;background:var(--accent)}
.paper .hud .ctr b{border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
.brandmark{display:flex;align-items:center;gap:10px;color:var(--ink);font:700 22px Inter}
.brandmark svg{width:30px;height:30px}

/* captions */
.cap{position:absolute;left:84px;right:84px;top:104px;height:220px}
.page{position:absolute;inset:0;font-weight:700;font-size:62px;line-height:1.12;letter-spacing:-.025em}
.w{display:inline-block;margin-right:.24em;opacity:0}
.w.acc{color:var(--accent)}
.paper .w.acc{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:1.16em;letter-spacing:-.005em;line-height:.9}
.cap.demo .page{font-size:46px;line-height:1.16}
.cap.demo{top:96px;height:130px}

/* stage */
.stage{position:absolute;left:84px;right:84px;top:300px;bottom:60px;display:flex;align-items:center;justify-content:center}
.it{will-change:transform,opacity}

/* sticker cards (paper) / glass cards (midnight) */
.card{background:var(--card);border-radius:22px;padding:26px 30px}
.paper .card{border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink)}
.midnight .card{border:1px solid var(--line);backdrop-filter:blur(8px);box-shadow:0 20px 60px rgba(0,0,0,.35)}

/* orbit */
.orbit{position:relative;width:1200px;height:640px}
.orbit .core{position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;display:grid;place-items:center;text-align:center;font:800 40px Inter;color:#fff;background:linear-gradient(135deg,#2F5BFF,#9A3CFF);border:4px solid var(--ink);box-shadow:10px 10px 0 var(--ink)}
.orbit .ring{position:absolute;left:50%;top:50%;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;border:3px dashed rgba(20,20,20,.35)}
.chip{position:absolute;padding:16px 26px;border-radius:999px;font:700 30px Inter;background:var(--card);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);white-space:nowrap}

/* bars */
.bars{width:1500px}
.bars h3{font:700 34px Inter;margin-bottom:26px}
.br{display:grid;grid-template-columns:260px 1fr 260px;align-items:center;gap:22px;margin:22px 0}
.br .l{font:700 34px Inter}
.br .t{height:58px;border-radius:14px;background:rgba(20,20,20,.08);overflow:hidden;border:3px solid var(--ink)}
.br .t i{display:block;height:100%;width:0;background:var(--accent)}
.br .v{font:800 46px 'JetBrains Mono',monospace;text-align:right}
.src{margin-top:18px;font:500 22px 'JetBrains Mono',monospace;color:var(--muted)}

/* compare */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:56px;width:1560px}
.cmp .card h4{font:800 38px Inter;margin-bottom:18px;display:flex;gap:14px;align-items:center}
.cmp li{list-style:none;font:600 32px Inter;margin:14px 0;display:flex;gap:14px;align-items:flex-start}
.cmp li .m{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:800 24px Inter;color:#fff}
.m.x{background:var(--bad,#E0352B)}.m.ok{background:var(--good,#1F9D55)}
.stamp{position:absolute;right:28px;top:22px;transform:rotate(8deg);font:800 30px Inter;color:var(--accent);border:4px solid var(--accent);border-radius:10px;padding:4px 14px;letter-spacing:.06em}

/* stack */
.stack{display:flex;gap:30px;align-items:flex-end}
.wall{width:430px;height:320px;display:flex;flex-direction:column;justify-content:space-between}
.wall .ico{font-size:72px}
.wall b{font:800 36px Inter}
.wall span{font:500 24px Inter;color:var(--muted)}
.wall .no{font:800 26px Inter;color:var(--accent)}

/* chat */
.chat{width:1300px}
.chat .head{display:flex;gap:16px;align-items:center;font:700 30px Inter;margin-bottom:18px}
.av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font:800 26px Inter;color:#fff;background:linear-gradient(135deg,#2F5BFF,#9A3CFF);flex:none}
.msg{font:500 31px/1.35 Inter;padding:18px 24px;border-radius:18px;margin:12px 0;max-width:1120px}
.msg.pg{background:rgba(20,20,20,.06);border:2px dashed rgba(20,20,20,.35)}
.msg.hidden{background:#FFE3DF;border:3px solid var(--accent);color:#7A1410}
.msg.ai{background:#141414;color:#fff;margin-left:auto}
.midnight .msg.ai{background:rgba(91,140,255,.18);color:var(--ink);border:1px solid rgba(91,140,255,.4)}
.midnight .msg.me{background:rgba(255,255,255,.08)}
.tag{display:inline-block;font:700 20px 'JetBrains Mono',monospace;letter-spacing:.05em;padding:4px 10px;border-radius:8px;margin-bottom:8px}
.tag.red{background:var(--accent);color:#fff}

/* reveal */
.reveal{text-align:center}
.orb{width:220px;height:220px;margin:0 auto 34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9DB8FF,#2F5BFF 45%,#7A2CFF);box-shadow:0 0 120px 30px rgba(91,140,255,.55);display:grid;place-items:center}
.orb svg{width:120px;height:120px}
.reveal h2{font:800 120px Inter;letter-spacing:-.04em}
.reveal p{font:500 40px Inter;color:var(--muted);margin-top:14px}
.reveal .pp{display:inline-flex;gap:12px;align-items:center;margin-top:30px;padding:14px 26px;border-radius:999px;border:1px solid var(--line);background:var(--card);font:700 30px Inter}

/* offer cards */
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:28px;width:1500px}
.offer{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center}
.offer .ic{width:76px;height:76px;border-radius:20px;display:grid;place-items:center;font:800 38px Inter;background:rgba(91,140,255,.18);color:var(--accent)}
.offer b{font:800 36px Inter;display:block}
.offer span{font:500 24px Inter;color:var(--muted)}
.offer .api{font:600 20px 'JetBrains Mono',monospace;color:var(--muted);text-align:right}
.offer .price{font:800 34px 'JetBrains Mono',monospace;text-align:right;color:var(--ink)}

/* flow */
.flow{display:flex;align-items:center;gap:0}
.node{width:270px;padding:28px 18px;text-align:center}
.node .k{font:700 22px 'JetBrains Mono',monospace;color:var(--accent);margin-bottom:10px}
.node b{font:800 34px Inter;display:block}
.node span{font:500 22px Inter;color:var(--muted);display:block;margin-top:8px}
.conn{width:62px;height:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transform-origin:left center}

/* checklist */
.checks{width:1300px}
.checks li{width:100%;list-style:none;display:flex;gap:22px;align-items:center;font:700 40px Inter;margin:20px 0}
.checks li .m{margin-left:0!important;flex:none;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font:800 30px Inter;color:#06240F;background:var(--good)}
.checks li span{font:500 28px Inter;color:var(--muted);margin-left:auto}

/* verdicts */
.verdicts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px;width:1640px}
.vd{position:relative}
.vd .vlabel{font:800 26px 'JetBrains Mono',monospace;letter-spacing:.06em;padding:6px 14px;border-radius:10px;display:inline-block;margin-bottom:16px}
.vd.allow .vlabel{background:rgba(61,220,132,.18);color:var(--good)}
.vd.ask .vlabel{background:rgba(255,194,75,.18);color:var(--warn)}
.vd.block .vlabel{background:rgba(255,93,93,.2);color:var(--bad)}
.vd.block{border-color:rgba(255,93,93,.6)!important;box-shadow:0 0 60px rgba(255,93,93,.25)}
.vd b{font:800 32px Inter;display:block}
.vd .amt{font:800 40px 'JetBrains Mono',monospace;margin:10px 0}
.vd p{font:500 24px/1.35 Inter;color:var(--muted)}
.vd q{display:block;font:italic 500 23px/1.35 Inter;color:var(--ink);margin-top:12px;quotes:none}

/* recording */
.rec{position:absolute;left:50%;top:250px;width:1340px;margin-left:-670px;border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.18);box-shadow:0 40px 120px rgba(0,0,0,.6),0 0 0 8px rgba(255,255,255,.03)}
.rec .bar{height:40px;background:#11172B;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.rec .bar i{width:13px;height:13px;border-radius:50%;background:#3a4363}
.rec .bar .url{margin-left:18px;flex:1;height:26px;border-radius:8px;background:#0A0F20;font:500 16px 'JetBrains Mono',monospace;color:#9AA6C8;display:flex;align-items:center;padding:0 12px}
.rec img{display:block;width:1340px;height:754px;object-fit:cover;background:#0a0e15}
.badge-live{position:absolute;right:16px;top:7px;font:700 15px 'JetBrains Mono',monospace;color:#06240F;background:var(--good);padding:4px 10px;border-radius:7px}
.speed{position:absolute;right:296px;top:196px;font:800 24px 'JetBrains Mono',monospace;background:rgba(6,10,26,.85);color:#fff;border:1px solid rgba(255,255,255,.2);padding:6px 12px;border-radius:10px;z-index:3}
.callout{position:absolute;z-index:4;padding:14px 22px;border-radius:14px;font:700 26px Inter;background:#FFC24B;color:#1b1300;box-shadow:0 14px 40px rgba(0,0,0,.45)}

/* mcp terminal */
.term{width:1500px;font:500 26px/1.5 'JetBrains Mono',monospace}
.term .row{display:grid;grid-template-columns:330px 1fr;gap:20px;padding:14px 0;border-bottom:1px solid var(--line)}
.term .fn{color:var(--accent)}
.term .res{color:var(--ink)}
.term .ok{color:var(--good)}

/* end */
.end{text-align:center}
.end h2{font:800 100px Inter;letter-spacing:-.04em}
.end p{font:500 38px Inter;color:var(--muted);margin-top:16px}
.end .repo{margin-top:46px;font:600 30px 'JetBrains Mono',monospace;color:var(--ink);padding:16px 28px;border:1px solid var(--line);border-radius:14px;display:inline-block;background:var(--card)}
.end .pills{display:flex;gap:16px;justify-content:center;margin-top:34px}
.end .pills span{font:700 26px Inter;padding:12px 22px;border-radius:999px;background:rgba(91,140,255,.15);border:1px solid rgba(91,140,255,.4)}
.big3{display:flex;gap:30px}
.big3 .card{width:480px;text-align:left}
.big3 b{font:800 40px Inter;display:block;margin-bottom:10px}
.big3 span{font:500 26px Inter;color:var(--muted)}
.triad{display:flex;flex-direction:column;align-items:center;gap:44px}
.triad .hub{display:flex;align-items:center;gap:16px;font:800 46px Inter;padding:16px 34px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.triad .hub svg{width:48px;height:48px}
.triad .row3{display:flex;gap:30px}
.who{width:500px;text-align:left;position:relative;transition:none}
.who .ico{font-size:58px;line-height:1;margin-bottom:12px}
.who .n{position:absolute;right:26px;top:22px;font:700 22px 'JetBrains Mono',monospace;color:var(--muted)}
.who b{font:800 40px Inter;display:block;margin-bottom:8px}
.who span{font:500 25px/1.35 Inter;color:var(--muted);display:block}
.who .gets{margin-top:18px;font:700 25px/1.35 Inter;color:var(--ink);padding-top:16px;border-top:1px solid var(--line)}
.who.dim{filter:grayscale(1) brightness(.6)}
.who.dim b,.who.dim span,.who.dim .gets{opacity:.45}
.who.on{border-color:var(--accent)!important;box-shadow:0 0 0 3px var(--accent),0 30px 80px rgba(91,140,255,.25)}
.paper .who.on{box-shadow:0 0 0 3px var(--accent),8px 8px 0 #111}
/* act progress */
.prog{position:absolute;left:84px;right:84px;bottom:14px;display:flex;gap:10px;z-index:5}
.prog .seg{flex:1;position:relative;height:5px;border-radius:3px;background:rgba(127,127,127,.25);overflow:visible}
.prog .seg i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;background:var(--accent)}
.prog .seg span{display:none}
/* recordings: camera wrapper and brand patch over the app's header logo */
.rec .view{width:1340px;height:754px;overflow:hidden;position:relative}
.rec .cam{width:1340px;height:754px;position:relative;will-change:transform}
.bpatch{position:absolute;left:46px;top:7px;height:30px;padding:0 10px 0 6px;display:flex;align-items:center;gap:7px;background:#0B1120;border-radius:6px;font:800 17px Inter;color:#F2F5FF}
.bpatch svg{width:20px;height:20px}
/* request flood */
.flood{width:1560px;text-align:center}
.flood .fhead{font:900 150px/1 Inter;letter-spacing:-.05em;color:var(--accent)}
.flood .fhead .u{font:800 44px Inter;letter-spacing:0;color:var(--ink);margin-left:16px}
.flood .lane{position:relative;height:300px;margin-top:26px}
.flood .bot,.flood .srv{position:absolute;top:30px;width:270px;height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.flood .bot{left:0;font-size:80px}.flood .bot b,.flood .srv b{font:800 28px Inter}
.flood .srv{right:0}.flood .sico{font-size:70px;line-height:1}
.flood .meter{width:190px;height:16px;border-radius:8px;background:rgba(127,127,127,.25);overflow:hidden}
.flood .meter i{display:block;height:100%;width:0;background:#3DDC84}
.flood .st{font:800 20px 'JetBrains Mono',monospace}
.flood .pk{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none}
.flood .p{position:absolute;top:0;font:800 17px 'JetBrains Mono',monospace;padding:4px 8px;border-radius:7px;background:var(--accent);color:#fff;white-space:nowrap}
.flood .p.blk{background:#FF5D5D}
.flood .shield{position:absolute;left:50%;top:10px;width:150px;height:280px;margin-left:-75px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:2px solid var(--accent);background:rgba(91,140,255,.12);box-shadow:0 0 60px rgba(91,140,255,.35)}
.flood .shield svg{width:70px;height:70px}.flood .shield b{font:800 24px Inter}
.flood .src{margin-top:8px}
/* gateway packets */
.gw{position:relative}
.gdot{position:absolute;width:18px;height:18px;border-radius:50%;background:var(--good);box-shadow:0 0 14px var(--good);margin:-9px 0 0 -9px;z-index:3}
.gdot.bad{background:var(--bad);box-shadow:0 0 14px var(--bad)}
.statx{text-align:center;position:relative}
.statx .num{font:900 230px/1 Inter;letter-spacing:-.05em;color:var(--accent)}
.statx .suf{font:800 90px Inter;margin-left:12px;color:var(--ink)}
.statx .lab{font:700 46px/1.25 Inter;margin-top:18px;max-width:1300px;margin-left:auto;margin-right:auto}
.statx .sub2{font:600 34px Inter;color:var(--muted);margin-top:18px}
.statx .src{margin-top:22px}
.statx .stamp{position:absolute;right:-40px;top:-10px}
.lineup{text-align:center}
.lineup h3{font:800 46px Inter;margin-bottom:40px}
.lrow{display:flex;gap:28px;justify-content:center}
.agentc{width:330px;height:330px;position:relative;padding:0!important;perspective:800px}
.agentc .face,.agentc .back{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;border-radius:inherit}
.agentc .bot{font-size:84px;line-height:1}
.agentc b{font:800 34px Inter}
.agentc .q{font:900 56px Inter;color:var(--muted)}
.agentc .back{opacity:0}
.agentc .back span{font:500 22px/1.3 Inter;color:var(--muted)}
.agentc .back em{font:800 22px 'JetBrains Mono',monospace;font-style:normal;padding:6px 12px;border-radius:9px}
.agentc .back.good{box-shadow:inset 0 0 0 3px var(--good)}
.agentc .back.good .bot,.agentc .back.good em{color:var(--good)}
.agentc .back.good em{background:rgba(61,220,132,.15)}
.agentc .back.bad{box-shadow:inset 0 0 0 3px var(--bad)}
.agentc .back.bad .bot,.agentc .back.bad em{color:var(--bad)}
.agentc .back.bad em{background:rgba(255,93,93,.15)}
.gw{display:flex;align-items:center;gap:0;width:1720px;justify-content:center}
.gcol{display:flex;flex-direction:column;gap:16px;width:330px}
.gh{font:700 22px 'JetBrains Mono',monospace;color:var(--muted);margin-bottom:4px}
.gagent{font:700 27px Inter;padding:16px 20px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.gagent.bad{border-color:rgba(255,93,93,.7);color:#FF8A8A}
.garrow{width:70px;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));transform-origin:left center}
.gate{width:820px;border:2px solid var(--accent)!important;box-shadow:0 0 0 6px rgba(91,140,255,.12),0 30px 90px rgba(91,140,255,.25)}
.gate .gtop{display:flex;align-items:center;gap:14px}
.gate .gtop svg{width:46px;height:46px}
.gate .gtop b{font:800 40px Inter}
.gate .gsub{font:500 22px Inter;color:var(--muted);margin:6px 0 10px}
.gate ol{list-style:none;padding:0;margin:0}
.gate li{display:flex;align-items:baseline;gap:16px;font:700 29px/1.25 Inter;padding:11px 0;border-top:1px solid var(--line)}
.gate li .k{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font:800 20px 'JetBrains Mono',monospace;background:rgba(91,140,255,.2);color:var(--accent);transform:translateY(4px)}
.gate li em{font:500 21px Inter;color:var(--muted);font-style:normal;margin-left:auto;text-align:right;white-space:nowrap}
.site{width:290px;text-align:left}
.site .ico{font-size:52px;margin-bottom:8px}
.site b{font:800 34px Inter;display:block}
.site span{font:500 22px/1.35 Inter;color:var(--muted);display:block;margin-top:8px}
.tiles{width:1600px;text-align:center}
.tiles h3{font:800 48px Inter;margin-bottom:34px}
.tiles .tg{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.tile{text-align:left}
.tile .ico{font-size:44px;margin-bottom:10px}
.tile b{font:800 40px Inter;display:block;margin-bottom:8px}
.tile span{font:500 24px/1.35 Inter;color:var(--muted);display:block}
.tile em{display:block;margin-top:14px;font:600 19px 'JetBrains Mono',monospace;color:var(--accent);font-style:normal}
.tiles .src{margin-top:26px}
.headline{width:1300px}
.headline .meta{font:600 24px 'JetBrains Mono',monospace;color:var(--muted);margin-bottom:12px}
.headline h3{font:800 52px/1.15 Inter}
.headline mark{background:linear-gradient(transparent 55%,rgba(224,53,43,.35) 55%);color:inherit;padding:0 4px}
</style>
</head>
<body>
<div id="root"></div>
<script>
const SHIELD = '<svg viewBox="0 0 32 32"><path d="M16 2 4 7v8c0 7.5 5.1 13.7 12 15 6.9-1.3 12-7.5 12-15V7z" fill="#5B8CFF"/><path d="m10 16 4 4 8-8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></svg>';
const SHIELD_W = '<svg viewBox="0 0 32 32"><path d="M16 2 4 7v8c0 7.5 5.1 13.7 12 15 6.9-1.3 12-7.5 12-15V7z" fill="#fff"/><path d="m10 16 4 4 8-8" stroke="#2F5BFF" stroke-width="3" fill="none" stroke-linecap="round"/></svg>';
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rich = (s) => esc(s).replace(/\*([^*]+)\*/g, '<em style="font-style:inherit;color:var(--accent)">$1</em>');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = (k) => 1 - Math.pow(1 - k, 3);
const back = (k) => { const c = 1.6; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const norm = (w) => w.toLowerCase().replace(/[^a-z0-9$%,.]/g, '').replace(/[.,]+$/, '');

let SB = null, SCENES = [];

function cueTimes(scene) {
  const words = scene.words || [];
  let from = 0;
  return (cue, fallback) => {
    if (cue === undefined || cue === null) return fallback;
    if (typeof cue === 'number') return cue;
    const c = norm(cue);
    for (let i = from; i < words.length; i++) {
      if (norm(words[i].w).startsWith(c)) { from = i + 1; return words[i].start; }
    }
    return fallback;
  };
}

// Each animated element: {el, at, dur, kind, ...}
function anim(list, el, at, kind = 'pop', dur = 0.5, extra = {}) { list.push(Object.assign({ el, at, dur, kind }, extra)); return el; }
function h(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; }

function buildCaption(scene, root, demo) {
  const cap = h(`<div class="cap ${demo ? 'demo' : ''}"></div>`);
  root.append(cap);
  const words = scene.words || [];
  const tokens = [];
  // caption text: tokens; "*" marks accent spans; " / " forces a page break.
  const raw = (scene.caption || scene.vo).split(/\s+/).filter(Boolean);
  let acc = false;
  for (const tok of raw) {
    if (tok === '/') { tokens.push({ brk: true }); continue; }
    let t = tok, a = acc;
    if (t.startsWith('*')) { a = true; t = t.slice(1); acc = true; }
    let endAcc = false;
    if (t.endsWith('*') || /\*[.,!?:;]+$/.test(t)) { t = t.replace('*', ''); endAcc = true; }
    tokens.push({ text: t, acc: a || endAcc && acc });
    if (endAcc) acc = false;
  }
  const real = tokens.filter((t) => !t.brk);
  // map caption words to spoken word times (same count expected; else proportional)
  const n = real.length, m = words.length;
  real.forEach((t, i) => {
    let st;
    if (m === n) st = words[i].start;
    else if (m) st = words[Math.min(m - 1, Math.floor(i * m / n))].start;
    else st = scene.lead + i * 0.35;
    t.start = st;
  });
  // pages: explicit breaks, else ~ maxChars
  const maxChars = demo ? 70 : 92;
  const pages = []; let cur = [], len = 0;
  for (const t of tokens) {
    if (t.brk) { if (cur.length) pages.push(cur); cur = []; len = 0; continue; }
    if (len + t.text.length > maxChars && cur.length) { pages.push(cur); cur = []; len = 0; }
    cur.push(t); len += t.text.length + 1;
  }
  if (cur.length) pages.push(cur);
  const out = [];
  pages.forEach((p, pi) => {
    const pg = h('<div class="page"></div>');
    p.forEach((t) => { const s = h(`<span class="w${t.acc ? ' acc' : ''}">${esc(t.text)}</span>`); pg.append(s); t.el = s; });
    cap.append(pg);
    out.push({ el: pg, start: p[0].start, words: p });
  });
  return out;
}

// The mechanism: agents -> SARA gateway (rules, 402, deposit, checks) -> the website.
V.gateway = (v, s, cue, A) => {
  const el = h(`<div class="gw"><div class="gcol agents"><div class="gh">${esc(v.leftTitle || 'Any AI agent')}</div></div><div class="garrow a1"></div><div class="card gate it"><div class="gtop">${SHIELD}<b>${rich(v.title || '*SARA* gateway')}</b></div><div class="gsub">${esc(v.sub || '')}</div><ol></ol></div><div class="garrow a2"></div><div class="card site it"><div class="ico">🌐</div><b>${esc(v.siteTitle || 'Your website')}</b><span>${esc(v.siteSub || '')}</span></div></div>`);
  v.agents.forEach((x, i) => { const c = h(`<div class="gagent it ${x.bad ? 'bad' : ''}">${esc(x.text)}</div>`); el.querySelector('.agents').append(c); anim(A, c, cue(x.cue, 0.2 + i * 0.25), 'pop', 0.4); });
  const gate = el.querySelector('.gate');
  anim(A, gate, cue(v.cue, 0.4), 'pop', 0.5);
  anim(A, el.querySelector('.a1'), cue(v.cue, 0.4) + 0.2, 'growx', 0.35);
  v.steps.forEach((x, i) => { const li = h(`<li class="it"><span class="k">${i + 1}</span>${rich(x.text)}${x.sub ? `<em>${esc(x.sub)}</em>` : ''}</li>`); gate.querySelector('ol').append(li); anim(A, li, cue(x.cue, 0.9 + i * 0.5), 'rise', 0.35); });
  const site = el.querySelector('.site');
  const st = cue(v.siteCue, 0.6);
  anim(A, site, st, 'pop', 0.5); anim(A, el.querySelector('.a2'), st - 0.15, 'growx', 0.3);
  // Packets: green ones pass through the gateway to the site; red ones (the rogue scraper) stop at the gate.
  const dots = [];
  for (let j = 0; j < 8; j++) { const d = h(`<div class="gdot ${j % 4 === 3 ? 'bad' : ''}"></div>`); el.append(d); dots.push(d); }
  const go = cue(v.flowCue, Math.max(gateAt(v, cue), 1.2));
  anim(A, el, 0, 'fn', 1, { fn: (t) => {
    const g = el.getBoundingClientRect(), gate = el.querySelector('.gate').getBoundingClientRect(), siteR = site.getBoundingClientRect(), ag = el.querySelector('.agents').getBoundingClientRect();
    const sx = g.width / el.offsetWidth || 1;
    const X = (px) => (px - g.left) / sx, y = (gate.top + gate.height / 2 - g.top) / sx;
    const xa = X(ag.right), xg0 = X(gate.left), xg1 = X(gate.right), xsite = X(siteR.left + 20);
    dots.forEach((d, j) => {
      if (t < go) { d.style.opacity = 0; return; }
      const ph = ((t - go) * 0.45 + j / dots.length) % 1;
      const bad = d.classList.contains('bad');
      let x, op = 1;
      if (ph < 0.35) x = xa + (xg0 - xa) * (ph / 0.35);
      else if (bad) { x = xg0; op = Math.max(0, 1 - (ph - 0.35) * 5); }
      else if (ph < 0.65) { x = xg0 + (xg1 - xg0) * ((ph - 0.35) / 0.3); op = 0.35; }
      else x = xg1 + (xsite - xg1) * ((ph - 0.65) / 0.35);
      d.style.opacity = op * clamp((t - go) / 0.4);
      d.style.left = x + 'px'; d.style.top = (y + (bad ? 0 : (j % 3 - 1) * 10)) + 'px';
    });
  } });
  return el;
};

// A bot firing requests at a website. Unblocked: the server's load meter fills and it shakes.
// Blocked: a shield in the middle stops the flood (429) and the server stays calm.
V.flood = (v, s, cue, A) => {
  const blocked = !!v.blocked;
  const el = h(`<div class="flood"><div class="fhead it"><span class="n">0</span><span class="u">${rich(v.unit || 'requests / minute')}</span></div><div class="lane"><div class="card bot it">🤖<b>${esc(v.botLabel || 'One AI bot')}</b></div><div class="pk"></div>${blocked ? `<div class="shield it">${SHIELD}<b>${esc((SB && SB.brand) || 'Gateway')}</b></div>` : ''}<div class="card srv it"><div class="sico">🖥️</div><b>${esc(v.siteLabel || 'One website')}</b><div class="meter"><i></i></div><span class="st">OK</span></div></div>${v.source ? `<div class="src it">${esc(v.source)}</div>` : ''}</div>`);
  const t0 = cue(v.cue, 0.3);
  const shieldT = blocked ? cue(v.shieldCue, t0 + 0.6) : 1e9;
  anim(A, el.querySelector('.bot'), 0.05, 'pop', 0.4);
  anim(A, el.querySelector('.srv'), 0.2, 'pop', 0.4);
  if (blocked) anim(A, el.querySelector('.shield'), shieldT, 'pop', 0.5, { sfx: 'impact' });
  anim(A, el.querySelector('.fhead'), t0, 'pop', 0.4, { sfx: 'impact' });
  anim(A, el.querySelector('.n'), t0, 'count', v.countDur || 2.2, { to: v.value || 39000, suffix: '' });
  if (v.source) anim(A, el.querySelector('.src'), t0 + 1, 'fade', 0.5);
  const pk = el.querySelector('.pk'), N = 34, P = [];
  for (let j = 0; j < N; j++) { const p = h(`<div class="p">GET</div>`); pk.append(p); P.push(p); }
  const srv = el.querySelector('.srv'), meter = el.querySelector('.meter i'), st = el.querySelector('.st');
  anim(A, el, 0, 'fn', 1, { fn: (t) => {
    const W = 1560, x0 = 280, x1 = W - 330, xs = W / 2 - 110;
    const run = Math.max(0, t - t0);
    const rate = 0.9 + Math.min(2.6, run * 0.9);            // the flood accelerates
    P.forEach((p, j) => {
      if (t < t0) { p.style.opacity = 0; return; }
      const ph = (run * rate * 0.55 + j / N) % 1;
      const lane = 30 + ((j * 53) % 220);
      let x = x0 + (x1 - x0) * ph, op = 1, blk = false;
      if (t > shieldT && x > xs) { blk = true; x = xs + Math.min(30, (x - xs) * 0.15); op = Math.max(0, 1 - (ph - (xs - x0) / (x1 - x0)) * 4); p.textContent = '429'; }
      else p.textContent = 'GET';
      p.classList.toggle('blk', blk);
      p.style.opacity = op * (run < 0.3 ? run / 0.3 : 1);
      p.style.transform = `translate(${x}px, ${lane}px)`;
    });
    let load = blocked ? (t > shieldT ? 0.12 : Math.min(0.5, run * 0.4)) : Math.min(1, run / 2.6);
    meter.style.width = (load * 100) + '%';
    meter.style.background = load > 0.8 ? '#FF5D5D' : load > 0.5 ? '#FFC24B' : '#3DDC84';
    st.textContent = load > 0.85 ? 'OVERLOADED' : load > 0.5 ? 'SLOWING' : 'OK';
    st.style.color = load > 0.85 ? '#E0352B' : '';
    srv.style.transform = load > 0.85 ? `translateX(${Math.sin(t * 60) * 6}px) rotate(${Math.sin(t * 47) * 1.2}deg)` : '';
  } });
  return el;
};

  if (v.title) anim(A, el.querySelector('h3'), 0.05, 'rise', 0.4);

  v.items.forEach((x, i) => {
    const c = h(`<div class="card tile it"><div class="ico">${x.icon || ''}</div><b>${rich(x.value)}</b><span>${esc(x.label)}</span>${x.api ? `<em>${esc(x.api)}</em>` : ''}</div>`);
    el.querySelector('.tg').append(c); anim(A, c, cue(x.cue, 0.3 + i * 0.4), 'pop', 0.45);
  });
  return el;
};

V.end = (v, s, cue, A) => {
  const el = h(`<div class="end"><div class="orb it">${SHIELD_W}</div><h2 class="it">${rich(v.title)}</h2><p class="it">${rich(v.sub)}</p><div class="pills it">${v.pills.map((p) => `<span>${esc(p)}</span>`).join('')}</div><div class="repo it">${esc(v.repo)}</div></div>`);
  ['.orb', 'h2', 'p', '.pills', '.repo'].forEach((q, i) => anim(A, el.querySelector(q), 0.1 + i * 0.35, i ? 'rise' : 'pop', 0.5));
  return el;
};

function buildScene(scene, idx) {
  const theme = scene.theme;
  const root = h(`<div class="scene ${theme}"></div>`);
  if (theme === 'midnight') root.append(h('<div class="glow g1"></div>'), h('<div class="glow g2"></div>'));
  const hud = h(`<div class="hud"><div>${esc(scene.chapter || '')}</div><div class="ctr"></div></div>`);
  if (scene.counter) hud.querySelector('.ctr').innerHTML = `${esc(scene.counter.label)} <b>${esc(scene.counter.value)}</b>`;
  else hud.querySelector('.ctr').innerHTML = `<span class="brandmark">${SHIELD}${esc((SB && SB.brand) || 'SARA')}</span>`;
  root.append(hud);
  // Chapter progress: one segment per act, filled by global time.
  if (SB && SB.acts) {
    const pb = h(`<div class="prog">${SB.acts.map((a) => `<div class="seg"><i></i><span>${esc(a)}</span></div>`).join('')}</div>`);
    root.append(pb);
    scene._prog = [...pb.querySelectorAll('.seg')];
  }
  const A = [];
  const cue = cueTimes(scene);
  const v = scene.visual || {};
  const isRec = v.type === 'rec';
  const pages = scene.caption === '' ? [] : buildCaption(scene, root, isRec);
  if (isRec) {
    const patch = v.brandPatch === false || !(SB && SB.brandPatch) ? '' : `<div class="bpatch">${SHIELD}<b>${esc(SB.brand)}</b></div>`;
    const rec = h(`<div class="rec"><div class="bar"><i></i><i></i><i></i><div class="url">${esc(v.url)}</div><span class="badge-live">${esc(v.badge || 'LIVE · PayPal Sandbox')}</span></div><div class="view"><div class="cam"><img>${patch}</div></div></div>`);
    root.append(rec);
    scene._cam = rec.querySelector('.cam');
    // Camera keyframes: {cue|at, x, y (0-1 focus point in the frame), s (zoom), d (move seconds)}.
    scene._camKeys = (v.cam || []).map((c) => ({ at: typeof c.at === 'number' ? c.at : cue(c.cue, c.at ?? 1), x: c.x ?? 0.5, y: c.y ?? 0.5, s: c.s ?? 1, d: c.d ?? 0.9 }));
    if (v.speed && v.speed > 1.4) root.append(h(`<div class="speed">⏩ ${(Math.round(v.speed * 2) / 2).toString()}× speed</div>`));
    (v.callouts || []).forEach((c) => { const co = h(`<div class="callout">${rich(c.text)}</div>`); co.style.left = c.x + 'px'; co.style.top = c.y + 'px'; root.append(co); anim(A, co, cue(c.cue, c.at ?? 1), 'pop', 0.4, { until: c.until }); });
    anim(A, rec, 0, 'fade', 0.35);
    scene._img = rec.querySelector('img');
  } else if (V[v.type]) {
    const stage = h('<div class="stage"></div>');
    stage.append(V[v.type](v, scene, cue, A));
    root.append(stage);
    scene._stage = stage;
  }
  document.getElementById('root').append(root);
  return { scene, root, A, pages, idx, img: scene._img || null };
}

// Camera on recordings (keyframed zoom to a focus point), slow drift on graphics, act progress.
function renderCamera(S, t) {
  const sc = S.scene, dur = sc.dur || 6;
  if (sc._cam) {
    let cur = { x: 0.5, y: 0.5, s: 1 };
    const keys = sc._camKeys.length ? sc._camKeys : [{ at: 0, x: 0.5, y: 0.45, s: 1.045, d: dur }];
    for (const kf of keys) {
      if (t <= kf.at) break;
      const k = ease(clamp((t - kf.at) / kf.d));
      cur = { x: cur.x + (kf.x - cur.x) * k, y: cur.y + (kf.y - cur.y) * k, s: cur.s + (kf.s - cur.s) * k };
    }
    sc._cam.style.transformOrigin = `${cur.x * 100}% ${cur.y * 100}%`;
    sc._cam.style.transform = `scale(${cur.s})`;
  }
  if (sc._stage) sc._stage.style.transform = `scale(${1 + 0.03 * clamp(t / dur)})`;
  if (sc._prog && SB.total) {
    const g = (sc.start || 0) + t;
    sc._prog.forEach((seg, i) => {
      const a = SB.actStarts[i], b = SB.actStarts[i + 1] ?? SB.total;
      seg.querySelector('i').style.width = (clamp((g - a) / (b - a)) * 100) + '%';
      seg.classList.toggle('cur', g >= a && g < b);
    });
  }
}

function transitionFor(P, S) {
  const sc = S.scene;
  if (sc.transition) return sc.transition;
  const pv = P.scene.visual || {}, v = sc.visual || {};
  if (P.scene.theme !== sc.theme) return 'iris';
  if (v.type === 'rec' && pv.type === 'rec') return pv.src === v.src ? 'fade' : 'slide';
  if (v.type === 'rec') return 'zoom';
  if ((P.scene.act ?? 0) !== (sc.act ?? 0)) return 'slide';
  return 'rise';
}

function styleTransition(P, S, kind, k) {
  const e = ease(k), r = S.root.style, p = P.root.style;
  r.zIndex = 2; p.zIndex = 1;
  if (kind === 'iris') r.clipPath = `circle(${e * 120}% at 50% 55%)`;
  else if (kind === 'slide') { r.transform = `translateX(${(1 - e) * 100}%)`; p.transform = `translateX(${-e * 35}%)`; p.filter = `brightness(${1 - 0.5 * e})`; }
  else if (kind === 'zoom') { r.opacity = clamp(k * 1.6); r.transform = `scale(${1.14 - 0.14 * e})`; }
  else if (kind === 'fade') r.opacity = e;
  else { r.opacity = clamp(k * 1.5); r.transform = `translateY(${(1 - e) * 60}px)`; }
}

function clearTransition(S) { const r = S.root.style; r.clipPath = r.transform = r.opacity = r.filter = r.zIndex = ''; }

const TRANS = 0.5;

function applyAnim(a, t) {
  const k = clamp((t - a.at) / a.dur);
  const el = a.el;
  if (a.until !== undefined && t > a.until) { el.style.opacity = 0; return; }
  switch (a.kind) {
    case 'pop': { const e = back(k); el.style.opacity = clamp(k * 2.2); el.style.transform = `scale(${0.82 + 0.18 * e})`; break; }
    case 'rise': { const e = ease(k); el.style.opacity = e; el.style.transform = `translateY(${(1 - e) * 34}px)`; break; }
    case 'drop': { const e = back(k); el.style.opacity = clamp(k * 2.5); el.style.transform = `translateY(${(1 - e) * -60}px) rotate(${(1 - e) * -4}deg)`; break; }
    case 'fade': el.style.opacity = ease(k); break;
    case 'slam': { const e = back(k); el.style.opacity = clamp(k * 3); el.style.transform = `rotate(8deg) scale(${2.2 - 1.2 * e})`; break; }
    case 'shake': { const e = back(k); el.style.opacity = clamp(k * 2.2); const sh = k < 1 ? Math.sin(k * 40) * (1 - k) * 14 : 0; el.style.transform = `scale(${0.85 + 0.15 * e}) translateX(${sh}px)`; break; }
    case 'grow': el.style.width = (ease(k) * a.to) + '%'; break;
    case 'growx': el.style.transform = `scaleX(${ease(k)})`; break;
    case 'fn': a.fn(t); break;
    case 'flipout': el.style.opacity = 1 - clamp(k * 1.5); el.style.transform = `rotateY(${ease(k) * 90}deg)`; break;
    case 'flipin': el.style.opacity = clamp(k * 2); el.style.transform = `rotateY(${(1 - ease(k)) * -90}deg)`; break;
    case 'count': { const val = Math.round(ease(k) * a.to); el.textContent = val.toLocaleString('en-US') + a.suffix; break; }
    case 'type': { el.style.opacity = k > 0 ? 1 : 0; if (!el.dataset.full) el.dataset.full = el.innerHTML; const full = el.dataset.full; const txt = el.textContent; break; }
  }
}

function renderScene(S, t) {
  for (const a of S.A) applyAnim(a, t);
  // captions: current page = last page whose start <= t (first page always shown)
  let cur = 0;
  S.pages.forEach((p, i) => { if (t >= p.start - 0.05) cur = i; });
  S.pages.forEach((p, i) => {
    p.el.style.display = i === cur ? 'block' : 'none';
    if (i === cur) p.words.forEach((w) => { const k = clamp((t - w.start + 0.05) / 0.16); w.el.style.opacity = 0.0 + k; w.el.style.transform = `translateY(${(1 - ease(k)) * 14}px)`; });
  });
}

window.__load = (storyboard) => {
  SB = storyboard;
  // The HUD counter carries over from the previous scene until a scene sets it (null clears it).
  let ctr = null;
  SB.scenes.forEach((s) => { if ('counter' in s) ctr = s.counter; else s.counter = ctr; });
  // Global timing (from build.py) for the act progress bar.
  if (SB.acts) {
    let t = 0;
    SB.scenes.forEach((s) => { s.start = t; t += s.dur || 0; });
    SB.total = t;
    SB.actStarts = SB.acts.map((_, i) => { const f = SB.scenes.find((s) => (s.act ?? 0) === i); return f ? f.start : t; });
  }
  SCENES = SB.scenes.map(buildScene);
  return SCENES.length;
};

// Sound cues for build.py: transitions and the moments items land, in scene-local seconds.
window.__events = () => SCENES.map((S, i) => {
  const ev = [];
  if (i > 0) { const k = transitionFor(SCENES[i - 1], S); if (k !== 'fade' && k !== 'cut') ev.push({ t: 0, k: k === 'iris' ? 'riser' : 'whoosh' }); }
  for (const a of S.A) {
    if (a.sfx) ev.push({ t: a.at, k: a.sfx });
    else if (['pop', 'drop', 'flipin'].includes(a.kind)) ev.push({ t: a.at, k: 'tick' });
    else if (a.kind === 'slam' || a.kind === 'shake') ev.push({ t: a.at, k: 'thud' });
  }
  return ev;
});

// t: global seconds. frameSrc: optional image URL for recording scenes.
window.__render = (sceneIndex, localT, frameSrc) => new Promise((resolve) => {
  const S = SCENES[sceneIndex];
  const P = sceneIndex > 0 ? SCENES[sceneIndex - 1] : null;
  const kind = P ? transitionFor(P, S) : 'cut';
  const mixing = P && kind !== 'cut' && localT < TRANS;
  SCENES.forEach((X, i) => { X.root.classList.toggle('on', i === sceneIndex || (mixing && X === P)); clearTransition(X); });
  if (mixing) { renderScene(P, P.scene.dur || 5); renderCamera(P, P.scene.dur || 5); styleTransition(P, S, kind, localT / TRANS); }
  renderScene(S, localT);
  renderCamera(S, localT);
  if (S.img && frameSrc) {
    if (S.img.getAttribute('src') === frameSrc) return resolve(true);
    S.img.onload = () => resolve(true);
    S.img.onerror = () => resolve(false);
    S.img.src = frameSrc;
  } else resolve(true);
});
</script>
</body>
</html>
